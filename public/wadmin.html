<!DOCTYPE html>
<html>
<head>
<title>Admin Dashboard - Women Safety</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #fff0f5; }
header { background: #d63384; color: white; padding: 15px; text-align: center; }
header h2 { font-size: 20px; }
.dashboard { max-width: 960px; margin: 40px auto; padding: 0 20px; }
.welcome { text-align: center; color: #b30059; font-size: 22px; margin-bottom: 30px; }
.stats { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; margin-bottom: 35px; }
.stat-box { background: #d63384; color: white; border-radius: 12px; padding: 25px 40px; text-align: center; min-width: 160px; }
.stat-box h1 { font-size: 40px; margin-bottom: 5px; }
.stat-box p { font-size: 14px; }
.stat-box.dark { background: #b30059; }
.card-row { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
.card {
  background: white; border-radius: 12px; padding: 30px 20px;
  width: 200px; text-align: center;
  box-shadow: 0 3px 10px rgba(0,0,0,0.1); cursor: pointer;
  transition: transform 0.2s;
}
.card:hover { transform: translateY(-4px); background: #ffe6f0; }
.card a { text-decoration: none; color: inherit; }
.card .icon { font-size: 36px; margin-bottom: 10px; }
.card h3 { color: #d63384; margin-bottom: 6px; }
.card p { font-size: 13px; color: #666; }
.logout-btn {
  display: block; width: 160px; margin: 35px auto;
  padding: 12px; background: #b30059; color: white;
  text-align: center; text-decoration: none;
  border-radius: 25px; font-size: 15px; font-weight: bold;
}
.logout-btn:hover { background: #8b0040; }
</style>
</head>
<body>

<header><h2>🌸 Admin Dashboard — Women Safety & Welfare</h2></header>

<div class="dashboard">
  <p class="welcome">Welcome, Admin 👋</p>

  <div class="stats">
    <div class="stat-box">
      <h1 id="totalComplaints">...</h1>
      <p>Total Complaints</p>
    </div>
    <div class="stat-box dark">
      <h1 id="totalUsers">...</h1>
      <p>Registered Users</p>
    </div>
    <div class="stat-box" style="background:#e74c3c;">
      <h1 id="totalSOS">...</h1>
      <p>SOS Alerts</p>
    </div>
  </div>

  <div class="card-row">
    <div class="card">
      <a href="wadmin_complaints.html">
        <div class="icon">📋</div>
        <h3>View Complaints</h3>
        <p>See all filed complaints</p>
      </a>
    </div>
    <div class="card">
      <a href="wadmin_users.html">
        <div class="icon">👥</div>
        <h3>Manage Users</h3>
        <p>View registered users</p>
      </a>
    </div>
    <div class="card">
      <a href="wprogram.html">
        <div class="icon">📢</div>
        <h3>Programs</h3>
        <p>View welfare programs</p>
      </a>
    </div>
    <div class="card">
      <a href="wabout.html">
        <div class="icon">ℹ️</div>
        <h3>About</h3>
        <p>Platform information</p>
      </a>
    </div>
  </div>

  <a href="wlogin.html" class="logout-btn">🔓 Logout</a>
</div>

<script>
async function loadStats(){
  try {
    const [cr, ur, sr] = await Promise.all([
      fetch("/api/complaint/all").then(r => r.json()),
      fetch("/api/users/all").then(r => r.json()),
      fetch("/api/sos/all").then(r => r.json())
    ]);
    document.getElementById("totalComplaints").innerText = cr.success ? cr.complaints.length : "—";
    document.getElementById("totalUsers").innerText      = ur.success ? ur.users.length      : "—";
    document.getElementById("totalSOS").innerText        = sr.success ? sr.alerts.length     : "—";
  } catch(e) {
    document.getElementById("totalComplaints").innerText = "—";
    document.getElementById("totalUsers").innerText      = "—";
    document.getElementById("totalSOS").innerText        = "—";
  }
}
loadStats();
</script>

</body>
</html>
