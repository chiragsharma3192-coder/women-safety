<!DOCTYPE html>
<html>
<head>
<title>My Complaints - Women Safety</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #ffe6f0; }
header { background: #d63384; color: white; padding: 15px; text-align: center; }
nav { background: #f8c6d8; padding: 10px; text-align: center; }
nav a { margin: 0 15px; text-decoration: none; color: #333; font-weight: bold; }
nav a:hover { color: #d63384; }
.section { padding: 30px 20px; max-width: 900px; margin: auto; }
h2 { color: #b30059; margin-bottom: 20px; text-align: center; }

.complaint-card {
  background: white; border-radius: 12px; padding: 20px;
  margin-bottom: 20px; box-shadow: 0 3px 10px rgba(0,0,0,0.1);
  border-left: 5px solid #d63384;
}
.complaint-card.resolved  { border-left-color: #28a745; }
.complaint-card.progress  { border-left-color: #007bff; }

.card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 10px; }
.card-header h3 { color: #b30059; font-size: 16px; }

.badge { padding: 5px 15px; border-radius: 20px; font-size: 13px; font-weight: bold; }
.badge-pending  { background: #fff3cd; color: #856404; }
.badge-progress { background: #cce5ff; color: #004085; }
.badge-resolved { background: #d4edda; color: #155724; }

.card-body p { font-size: 14px; color: #555; margin-bottom: 6px; line-height: 1.6; }
.card-body strong { color: #333; }
.remark-box { background: #f0f8ff; border-radius: 8px; padding: 10px 15px; margin-top: 10px; font-size: 14px; color: #004085; border-left: 3px solid #007bff; }
.date-text { font-size: 12px; color: #aaa; margin-top: 8px; }

.no-complaints { text-align: center; padding: 50px; color: #888; }
.no-complaints .icon { font-size: 50px; margin-bottom: 15px; }

.new-btn { display: inline-block; padding: 12px 25px; background: #d63384; color: white; text-decoration: none; border-radius: 25px; font-weight: bold; margin-bottom: 20px; }
#loading { text-align: center; padding: 30px; color: #888; }
footer { background: #b30059; color: white; padding: 15px; text-align: center; font-size: 13px; margin-top: 30px; }
</style>
</head>
<body>

<header><h2>🌸 Women Safety & Welfare System</h2></header>
<nav>
  <a href="women.html">Home</a>
  <a href="wcomplaint.html">New Complaint</a>
  <a href="wprofile.html">My Profile</a>
  <a href="wlogin.html">Logout</a>
</nav>

<div class="section">
  <h2>📋 My Complaints</h2>
  <a href="wcomplaint.html" class="new-btn">+ File New Complaint</a>

  <div id="loading">Loading your complaints...</div>
  <div id="complaintList"></div>
</div>

<footer><p>© 2024 Women Safety & Welfare System</p></footer>

<script>
var userPhone = localStorage.getItem("user_phone");
if(!userPhone){ alert("Please login first!"); window.location.href = "wlogin.html"; }

async function loadMyComplaints(){
  try {
    const res  = await fetch("/api/complaint/mystatus", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ phone: userPhone })
    });
    const data = await res.json();
    document.getElementById("loading").style.display = "none";

    if(data.success && data.complaints.length > 0){
      var html = "";
      data.complaints.forEach(function(c){
        var status    = c.status || "Pending";
        var cardClass = status === "Resolved" ? "resolved" : status === "In Progress" ? "progress" : "";
        var badgeClass= status === "Resolved" ? "badge-resolved" : status === "In Progress" ? "badge-progress" : "badge-pending";
        var statusIcon= status === "Resolved" ? "✅" : status === "In Progress" ? "🔵" : "🔴";

        html += `
        <div class="complaint-card ${cardClass}">
          <div class="card-header">
            <h3>${statusIcon} ${c.complaint_type}</h3>
            <span class="badge ${badgeClass}">${status}</span>
          </div>
          <div class="card-body">
            <p><strong>📍 Location:</strong> ${c.location}</p>
            <p><strong>📝 Description:</strong> ${c.description}</p>
            ${c.admin_remark ? `<div class="remark-box">💬 <strong>Admin Remark:</strong> ${c.admin_remark}</div>` : ""}
            <p class="date-text">📅 Filed on: ${new Date(c.submittedAt).toLocaleDateString("en-IN", {day:"numeric", month:"long", year:"numeric"})}</p>
          </div>
        </div>`;
      });
      document.getElementById("complaintList").innerHTML = html;
    } else {
      document.getElementById("complaintList").innerHTML = `
        <div class="no-complaints">
          <div class="icon">📭</div>
          <p>You have not filed any complaints yet.</p>
          <br>
          <a href="wcomplaint.html" class="new-btn">File a Complaint</a>
        </div>`;
    }
  } catch(err){
    document.getElementById("loading").innerText = "Error loading complaints.";
  }
}

loadMyComplaints();
</script>
</body>
</html>
