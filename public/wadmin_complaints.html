<!DOCTYPE html>
<html>
<head>
<title>Complaints - Admin</title>
<style>
body{ margin:0; font-family:Arial,sans-serif; background:#fff0f5; }
header{ background:#d63384; color:white; padding:15px; text-align:center; }
.section{ padding:30px; max-width:1100px; margin:auto; }
h2{ color:#b30059; }
table{ width:100%; border-collapse:collapse; background:white; border-radius:10px; overflow:hidden; box-shadow:0 0 10px rgba(0,0,0,0.1); }
th{ background:#d63384; color:white; padding:12px; text-align:left; }
td{ padding:10px 12px; border-bottom:1px solid #f0c0d0; font-size:13px; }
tr:hover{ background:#fff0f5; }
.back-btn{ display:inline-block; margin-bottom:15px; padding:8px 18px; background:#d63384; color:white; text-decoration:none; border-radius:5px; }
#loading{ text-align:center; padding:20px; color:#888; }
</style>
</head>
<body>
<header><h2>Admin - View Complaints</h2></header>
<div class="section">
  <a href="wadmin.html" class="back-btn">← Back to Dashboard</a>
  <h2>All Complaints</h2>
  <p id="loading">Loading complaints...</p>
  <table id="complaintTable" style="display:none;">
    <thead>
      <tr><th>#</th><th>Name</th><th>Phone</th><th>Type</th><th>Location</th><th>Description</th><th>Date</th></tr>
    </thead>
    <tbody id="complaintBody"></tbody>
  </table>
</div>

<script>
async function loadComplaints(){
    try {
        const res  = await fetch("/api/complaint/all");
        const data = await res.json();
        document.getElementById("loading").style.display = "none";

        if(data.success && data.complaints.length > 0){
            document.getElementById("complaintTable").style.display = "table";
            var html = "";
            data.complaints.forEach(function(c, i){
                html += "<tr><td>" + (i+1) + "</td><td>" + c.name + "</td><td>" + c.phone + "</td><td>" + c.complaint_type + "</td><td>" + c.location + "</td><td>" + c.description.substring(0,80) + "...</td><td>" + new Date(c.submittedAt).toLocaleDateString() + "</td></tr>";
            });
            document.getElementById("complaintBody").innerHTML = html;
        } else {
            document.getElementById("loading").innerText = "No complaints found.";
            document.getElementById("loading").style.display = "block";
        }
    } catch(err){
        document.getElementById("loading").innerText = "Error loading data.";
    }
}
loadComplaints();
</script>
</body>
</html>
