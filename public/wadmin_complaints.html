<!DOCTYPE html>
<html>
<head>
<title>Complaints - Admin</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #fff0f5; }
header { background: #d63384; color: white; padding: 15px; text-align: center; }
.section { padding: 30px; max-width: 1200px; margin: auto; }
h2 { color: #b30059; margin-bottom: 20px; }
table { width: 100%; border-collapse: collapse; background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
th { background: #d63384; color: white; padding: 12px; text-align: left; font-size: 13px; }
td { padding: 10px 12px; border-bottom: 1px solid #f0c0d0; font-size: 13px; vertical-align: middle; }
tr:hover { background: #fff5f8; }
.back-btn { display: inline-block; margin-bottom: 20px; padding: 8px 18px; background: #d63384; color: white; text-decoration: none; border-radius: 5px; }
#loading { text-align: center; padding: 20px; color: #888; }

/* Status badges */
.badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; }
.badge-pending    { background: #fff3cd; color: #856404; }
.badge-progress   { background: #cce5ff; color: #004085; }
.badge-resolved   { background: #d4edda; color: #155724; }

/* Modal */
.modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; justify-content: center; align-items: center; }
.modal-overlay.active { display: flex; }
.modal { background: white; border-radius: 12px; padding: 30px; width: 90%; max-width: 450px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
.modal h3 { color: #b30059; margin-bottom: 20px; }
label { font-weight: bold; display: block; margin-top: 15px; font-size: 14px; color: #555; }
select, textarea { width: 100%; padding: 10px; margin-top: 5px; border-radius: 6px; border: 1px solid #ccc; font-size: 14px; }
textarea { height: 100px; resize: vertical; }
.modal-btns { display: flex; gap: 10px; margin-top: 20px; }
.btn-save { flex: 1; padding: 12px; background: #d63384; color: white; border: none; border-radius: 25px; font-size: 15px; cursor: pointer; font-weight: bold; }
.btn-save:hover { background: #b30059; }
.btn-cancel { flex: 1; padding: 12px; background: #6c757d; color: white; border: none; border-radius: 25px; font-size: 15px; cursor: pointer; }
.update-btn { padding: 6px 14px; background: #d63384; color: white; border: none; border-radius: 20px; cursor: pointer; font-size: 12px; }
.update-btn:hover { background: #b30059; }
</style>
</head>
<body>

<header><h2>🌸 Admin - Manage Complaints</h2></header>

<div class="section">
  <a href="wadmin.html" class="back-btn">← Back to Dashboard</a>
  <h2>All Complaints</h2>
  <p id="loading">Loading complaints...</p>

  <table id="complaintTable" style="display:none;">
    <thead>
      <tr>
        <th>#</th>
        <th>Name</th>
        <th>Phone</th>
        <th>Type</th>
        <th>Location</th>
        <th>Description</th>
        <th>Date</th>
        <th>Status</th>
        <th>Remark</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="complaintBody"></tbody>
  </table>
</div>

<!-- UPDATE STATUS MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3>✏️ Update Complaint Status</h3>
    <input type="hidden" id="modal_id">

    <label>Status</label>
    <select id="modal_status">
      <option value="Pending">🔴 Pending</option>
      <option value="In Progress">🔵 In Progress</option>
      <option value="Resolved">🟢 Resolved</option>
    </select>

    <label>Admin Remark</label>
    <textarea id="modal_remark" placeholder="Add a remark for the user..."></textarea>

    <div class="modal-btns">
      <button class="btn-save" onclick="saveStatus()">💾 Save</button>
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<script>
async function loadComplaints(){
  try {
    const res  = await fetch("/api/complaint/all");
    const data = await res.json();
    document.getElementById("loading").style.display = "none";

    if(data.success && data.complaints.length > 0){
      document.getElementById("complaintTable").style.display = "table";
      var html = "";
      data.complaints.forEach(function(c, i){
        var badgeClass = c.status === "Resolved" ? "badge-resolved" : c.status === "In Progress" ? "badge-progress" : "badge-pending";
        html += `<tr>
          <td>${i+1}</td>
          <td>${c.name}</td>
          <td>${c.phone}</td>
          <td>${c.complaint_type}</td>
          <td>${c.location}</td>
          <td>${c.description.substring(0,60)}...</td>
          <td>${new Date(c.submittedAt).toLocaleDateString()}</td>
          <td><span class="badge ${badgeClass}">${c.status || "Pending"}</span></td>
          <td style="font-size:12px; color:#555;">${c.admin_remark || "—"}</td>
          <td><button class="update-btn" onclick="openModal('${c._id}','${c.status||"Pending"}','${(c.admin_remark||"").replace(/'/g,"\\'")}')">✏️ Update</button></td>
        </tr>`;
      });
      document.getElementById("complaintBody").innerHTML = html;
    } else {
      document.getElementById("loading").innerText = "No complaints found.";
      document.getElementById("loading").style.display = "block";
    }
  } catch(err){
    document.getElementById("loading").innerText = "Error loading data.";
  }
}

function openModal(id, status, remark){
  document.getElementById("modal_id").value     = id;
  document.getElementById("modal_status").value = status;
  document.getElementById("modal_remark").value = remark;
  document.getElementById("modalOverlay").classList.add("active");
}

function closeModal(){
  document.getElementById("modalOverlay").classList.remove("active");
}

async function saveStatus(){
  var id     = document.getElementById("modal_id").value;
  var status = document.getElementById("modal_status").value;
  var remark = document.getElementById("modal_remark").value;

  try {
    const res  = await fetch("/api/complaint/update-status", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id, status, admin_remark: remark })
    });
    const data = await res.json();
    if(data.success){
      closeModal();
      loadComplaints();
    } else {
      alert("Error: " + data.message);
    }
  } catch(err){
    alert("Cannot connect to server.");
  }
}

loadComplaints();
</script>
</body>
</html>
