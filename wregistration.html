<!-- ✅ FORM FIXED -->
<form action="wregistration.php" method="POST" onsubmit="return validateForm()">

<label>Full Name</label><br>
<input type="text" name="fullname" placeholder="Enter your full name" required><br><br>

<label>Email</label><br>
<input type="email" name="email" placeholder="Enter your email" required><br><br>

<label>Phone Number</label><br>

<!-- (Optional fields – abhi backend me use nahi ho rahe) -->

<label>User_ID</label><br>
<input type="text" placeholder="Enter unique user_ID"><br><br>

<label>Password</label><br>
<input type="password" name="password" placeholder="Create password" required><br><br>

<label>Confirm Password</label><br>
<input type="password" placeholder="Confirm password" required><br><br>

<button type="submit">Register</button>

</form>

</div>

<p>Women Helpline: 181 | Police: 100 | Ambulance: 108</p>
</div>

<script>
function validateForm(){
    var pass = document.querySelector("input[name='password']").value;
    var confirm = document.querySelectorAll("input[type='password']")[1].value;
    if(pass !== confirm){
        alert("Passwords do not match!");
        return false;
    }
    if(pass.length < 6){
        alert("Password must be at least 6 characters.");
        return false;
    }
    return true;
}
</script>
