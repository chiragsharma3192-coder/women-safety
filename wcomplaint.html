<!DOCTYPE html>
<html>
<head>
<title>File Complaint - Women Safety</title>
<style>
body { margin:0; font-family:Arial, sans-serif; background:#ffe6f0; }
header { background:#d63384; color:white; padding:15px; text-align:center; }
nav { background:#f8c6d8; padding:10px; text-align:center; }
nav a { margin:15px; text-decoration:none; color:black; font-weight:bold; }
.section { padding:40px; max-width:700px; margin:auto; }
h2 { color:#b30059; text-align:center; }
label { font-weight:bold; display:block; margin-top:15px; }
input, select, textarea {
    width:100%; padding:10px; margin-top:5px;
    border-radius:5px; border:1px solid #ccc;
    box-sizing:border-box; font-size:14px;
}
textarea { height:120px; resize:vertical; }
button {
    width:100%; padding:12px; margin-top:20px;
    background:#d63384; color:white;
    border:none; font-size:16px; cursor:pointer; border-radius:5px;
}
button:hover { background:#b30059; }
.form-box { background:white; padding:30px; border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,0.1); }
.footer { background:#d63384; color:white; padding:15px; text-align:center; margin-top:40px; }
.success-msg { display:none; background:#d4edda; color:#155724; padding:15px; border-radius:5px; text-align:center; margin-top:15px; }
</style>
</head>
<body>

<header><h2>Women Safety & Welfare System</h2></header>

<nav>
<a href="women.html">Home</a>
<a href="wabout.html">About</a>
<a href="wprogram.html">Programs</a>
<a href="wlogin.html">Login</a>
</nav>

<div class="section">
<h2>File a Complaint</h2>
<p style="text-align:center; color:#555;">Your complaint is confidential and will be handled with priority.</p>

<div class="form-box">
<form action="wcomplaint.php" method="POST" onsubmit="return submitComplaint(event)">

    <label>Your Name</label>
    <input type="text" name="name" placeholder="Enter your full name" required>

    <label>Phone Number</label>
    <input type="text" name="phone" placeholder="Enter your phone number" required>

    <label>Email (Optional)</label>
    <input type="email" name="email" placeholder="Enter your email">

    <label>Type of Complaint</label>
    <select name="complaint_type" required>
        <option value="">-- Select Type --</option>
        <option value="Harassment">Harassment</option>
        <option value="Domestic Violence">Domestic Violence</option>
        <option value="Stalking">Stalking</option>
        <option value="Cyber Crime">Cyber Crime</option>
        <option value="Workplace Abuse">Workplace Abuse</option>
        <option value="Other">Other</option>
    </select>

    <label>Location / City</label>
    <input type="text" name="location" placeholder="Where did this happen?" required>

    <label>Describe the Incident</label>
    <textarea name="description" placeholder="Describe what happened in detail..." required></textarea>

    <button type="submit">Submit Complaint</button>
</form>

<div class="success-msg" id="successMsg">
    ✅ Your complaint has been submitted successfully. We will contact you shortly.
</div>
</div>
</div>

<div class="footer">
<p>Women Helpline: 181 | Police: 100 | Ambulance: 108</p>
</div>

<script>
function submitComplaint(e){
    e.preventDefault();
    // Show success message (replace with actual form submit when backend is ready)
    document.getElementById("successMsg").style.display = "block";
    e.target.reset();
    setTimeout(function(){ document.getElementById("successMsg").style.display = "none"; }, 5000);
    return false;
}
</script>

</body>
</html>
