<!DOCTYPE html>
<html>
<head>
<title>Login - Women Safety</title>

<style>
body {
    font-family: Arial;
    background: #ffe6f0;
    text-align: center;
}

.container {
    margin-top: 100px;
}

input {
    padding: 10px;
    margin: 8px;
    width: 250px;
}

button {
    padding: 10px;
    width: 270px;
    background: #d63384;
    color: white;
    border: none;
}

a {
    display: block;
    margin-top: 10px;
}
</style>

</head>

<body>

<div class="container">
    <h2>Login</h2>

    <input id="email" placeholder="Email"><br>
    <input id="password" type="password" placeholder="Password"><br>

    <button onclick="login()">Login</button>

    <a href="register.html">New user? Register</a>
</div>

<script>
function login(){
    fetch('http://localhost:5000/login',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
            email: email.value,
            password: password.value
        })
    })
    .then(res=>res.json())
    .then(user=>{
        if(user.email){
            localStorage.setItem("user", JSON.stringify(user));
            window.location = "home.html";
        } else {
            alert("Invalid login");
        }
    });
}
</script>

</body>
</html>
