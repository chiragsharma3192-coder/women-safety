<!DOCTYPE html>
<html>
<head>
<title>Login - Women Safety & Welfare</title>

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background:#ffe6f0;
}

header{
    background:#d63384;
    color:white;
    padding:15px;
    text-align:center;
}

nav{
    background:#f8c6d8;
    padding:10px;
    text-align:center;
}

nav a{
    margin:15px;
    text-decoration:none;
    color:black;
    font-weight:bold;
}

.login-box{
    width:350px;
    margin:80px auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0px 0px 10px gray;
}

.login-box h2{
    text-align:center;
    color:#b30059;
}

input{
    width:100%;
    padding:10px;
    margin-top:10px;
    border-radius:5px;
    border:1px solid #ccc;
}

button{
    width:100%;
    padding:10px;
    margin-top:20px;
    background:#d63384;
    color:white;
    border:none;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#b30059;
}

p{
    text-align:center;
    margin-top:15px;
}

a{
    color:#d63384;
    text-decoration:none;
}
</style>

</head>

<body>

<header>
<h2>Women Safety & Welfare System</h2>
</header>
<div class="login-box">

<h2>Login (Admin / User)</h2>

<form onsubmit="return validateLogin()">

<input type="text" id="username" placeholder="Enter Username" required>

<input type="password" id="password" placeholder="Enter Password" required>

<button type="submit">Login</button>

<p>New User? <a href="wregistration.html">Register Here</a></p>

</form>

</div>

<script>
function validateLogin(){

    var user = document.getElementById("username").value;
    var pass = document.getElementById("password").value;

    // Admin Login
    if(user === "admin" && pass === "admin123"){
        alert("Admin Login Successful");
        window.location.href = "wadmin.html";
        return false;
    }

    // User Login
    else if(user === "user" && pass === "1234"){
        alert("User Login Successful");
        window.location.href = "women.html";
        return false;
    }

    // Invalid
    else{
        alert("Invalid Username or Password");
        return false;
    }
}
</script>

</body>
</html>
